<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>战锤40K 图片轮播</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .carousel-container {
            position: relative;
            width: 90vw;
            max-width: 1200px;
            height: 80vh;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }

        .carousel-slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .carousel-slide.active {
            opacity: 1;
            z-index: 1;
        }

        .carousel-slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .carousel-info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 15px 30px;
            border-radius: 25px;
            z-index: 10;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 24px;
            z-index: 100;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .title {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.9);
            z-index: 10;
            background: rgba(139, 0, 0, 0.6);
            padding: 10px 30px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>
    <div class="carousel-container">
        <div class="title">⚔️ 战锤40K 轮播 ⚔️</div>
        <div class="loading" id="loading">
            <div class="spinner"></div>
            加载中...
        </div>
        <div id="carousel"></div>
        <div class="carousel-info" id="info">图片 1 / 100</div>
    </div>

    <script>
        // 战锤40K相关图片URL列表（使用Unsplash和其他公开图片源）
        // 注意：实际应用中，您应该使用自己的图片或有授权的图片
        const imageTopics = [
            // Unsplash 搜索关键词相关的图片
            'space+marine', 'warhammer', 'sci-fi+warrior', 'futuristic+armor',
            'space+battle', 'alien+war', 'gothic+architecture', 'dystopian+future',
            'mech+warrior', 'space+fortress', 'dark+fantasy', 'armored+soldier',
            'cyberpunk+warrior', 'sci-fi+weapon', 'space+ship+battle', 'futuristic+city',
            'robot+warrior', 'space+station', 'alien+creature', 'medieval+armor'
        ];

        // 生成100张图片URL
        function generateImageUrls() {
            const urls = [];
            const baseWidth = 1200;
            const baseHeight = 800;

            for (let i = 0; i < 100; i++) {
                // 使用不同的策略生成图片URL
                const strategy = i % 3;

                if (strategy === 0) {
                    // 使用Unsplash随机图片API
                    const topic = imageTopics[i % imageTopics.length];
                    urls.push(`https://source.unsplash.com/${baseWidth}x${baseHeight}/?${topic}&sig=${i}`);
                } else if (strategy === 1) {
                    // 使用Picsum随机图片
                    urls.push(`https://picsum.photos/${baseWidth}/${baseHeight}?random=${i}`);
                } else {
                    // 使用Unsplash collection (战斗、科幻主题)
                    urls.push(`https://source.unsplash.com/collection/1163637/${baseWidth}x${baseHeight}?sig=${i}`);
                }
            }

            return urls;
        }

        // 洗牌算法（Fisher-Yates）
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // 初始化轮播
        let imageUrls = generateImageUrls();
        let shuffledUrls = shuffleArray(imageUrls);
        let currentIndex = 0;
        let carouselInterval;

        const carousel = document.getElementById('carousel');
        const info = document.getElementById('info');
        const loading = document.getElementById('loading');

        // 预加载图片
        function preloadImages(urls, callback) {
            let loadedCount = 0;
            const totalImages = urls.length;

            urls.forEach((url, index) => {
                const img = new Image();
                img.onload = img.onerror = () => {
                    loadedCount++;
                    if (loadedCount === totalImages) {
                        callback();
                    }
                };
                img.src = url;
            });
        }

        // 创建轮播幻灯片
        function createSlides() {
            carousel.innerHTML = '';
            shuffledUrls.forEach((url, index) => {
                const slide = document.createElement('div');
                slide.className = 'carousel-slide';
                if (index === 0) slide.classList.add('active');

                const img = document.createElement('img');
                img.src = url;
                img.alt = `战锤40K 图片 ${index + 1}`;
                img.onerror = function() {
                    // 如果图片加载失败，使用备用图片
                    this.src = `https://via.placeholder.com/1200x800/1a1a1a/8b0000?text=Warhammer+40K+Image+${index + 1}`;
                };

                slide.appendChild(img);
                carousel.appendChild(slide);
            });
        }

        // 显示下一张图片
        function showNextSlide() {
            const slides = document.querySelectorAll('.carousel-slide');
            slides[currentIndex].classList.remove('active');

            currentIndex = (currentIndex + 1) % shuffledUrls.length;

            // 如果回到开头，重新洗牌
            if (currentIndex === 0) {
                console.log('重新开始循环，重新洗牌...');
                setTimeout(() => {
                    shuffledUrls = shuffleArray(imageUrls);
                    createSlides();
                }, 1000);
            }

            slides[currentIndex].classList.add('active');
            info.textContent = `图片 ${currentIndex + 1} / ${shuffledUrls.length}`;
        }

        // 启动轮播
        function startCarousel() {
            createSlides();
            loading.style.display = 'none';
            info.textContent = `图片 1 / ${shuffledUrls.length}`;

            // 每3秒切换一次
            carouselInterval = setInterval(showNextSlide, 3000);
        }

        // 初始化
        console.log('开始加载战锤40K图片轮播...');
        // 预加载前10张图片后开始播放
        preloadImages(shuffledUrls.slice(0, 10), () => {
            console.log('初始图片加载完成，开始轮播');
            startCarousel();
        });

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                clearInterval(carouselInterval);
                showNextSlide();
                carouselInterval = setInterval(showNextSlide, 3000);
            }
        });
    </script>
</body>
</html>

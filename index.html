<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>战锤40K 图片轮播</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .carousel-container {
            position: relative;
            width: 90vw;
            max-width: 1200px;
            height: 80vh;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }

        .carousel-slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .carousel-slide.active {
            opacity: 1;
            z-index: 1;
        }

        .carousel-slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .carousel-info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 15px 30px;
            border-radius: 25px;
            z-index: 10;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            text-align: center;
        }

        .loading-status {
            display: block;
            font-size: 14px;
            margin-top: 5px;
            color: #ffcc00;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 20px;
            z-index: 100;
            text-align: center;
            width: 80%;
            max-width: 400px;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .title {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.9);
            z-index: 10;
            background: rgba(139, 0, 0, 0.6);
            padding: 10px 30px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }

        .controls {
            position: absolute;
            top: 50%;
            width: 100%;
            transform: translateY(-50%);
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 5;
        }

        .nav-button {
            background: rgba(139, 0, 0, 0.7);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .nav-button:hover {
            background: rgba(139, 0, 0, 0.9);
            transform: scale(1.1);
        }

        .nav-button:active {
            transform: scale(0.95);
        }

        .instructions {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #ccc;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 10;
            backdrop-filter: blur(5px);
        }

        .image-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffcc00;
            font-size: 18px;
            z-index: 2;
            display: none;
        }

        .image-loading.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="carousel-container">
        <div class="title">⚔️ 战锤40K 图片浏览 ⚔️</div>
        <div class="instructions">
            ← → 方向键切换 | 空格键下一张 | 点击按钮切换
        </div>
        <div class="loading" id="initialLoading">
            <div class="spinner"></div>
            <div>准备图片中...</div>
        </div>
        <div class="image-loading" id="imageLoading">
            <div class="spinner"></div>
            正在加载图片...
        </div>
        <div id="carousel"></div>

        <div class="controls">
            <button class="nav-button" id="prevBtn" title="上一张">◄</button>
            <button class="nav-button" id="nextBtn" title="下一张">►</button>
        </div>

        <div class="carousel-info" id="info">
            图片 1 / 100
            <span class="loading-status" id="loadStatus"></span>
        </div>
    </div>

    <script>
        // 战锤40K相关图片URL列表
        const imageTopics = [
            'space+marine', 'warhammer', 'sci-fi+warrior', 'futuristic+armor',
            'space+battle', 'alien+war', 'gothic+architecture', 'dystopian+future',
            'mech+warrior', 'space+fortress', 'dark+fantasy', 'armored+soldier',
            'cyberpunk+warrior', 'sci-fi+weapon', 'space+ship+battle', 'futuristic+city',
            'robot+warrior', 'space+station', 'alien+creature', 'medieval+armor',
            'sci-fi+helmet', 'power+armor', 'war+machine', 'epic+battle'
        ];

        // 生成100张图片URL
        function generateImageUrls() {
            const urls = [];
            const baseWidth = 800;
            const baseHeight = 600;

            for (let i = 0; i < 100; i++) {
                const topic = imageTopics[i % imageTopics.length];
                // 只使用Unsplash，更可靠
                urls.push(`https://source.unsplash.com/${baseWidth}x${baseHeight}/?${topic}&sig=${i}&cache=${Date.now()}`);
            }

            return urls;
        }

        // 洗牌算法（Fisher-Yates）
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // 初始化变量
        let imageUrls = generateImageUrls();
        let shuffledUrls = shuffleArray(imageUrls);
        let currentIndex = 0;
        let imageCache = {};
        let loadedImages = new Set();

        const carousel = document.getElementById('carousel');
        const info = document.getElementById('info');
        const initialLoading = document.getElementById('initialLoading');
        const imageLoading = document.getElementById('imageLoading');
        const loadStatus = document.getElementById('loadStatus');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        // 可靠的图片加载函数
        function loadImageReliably(url, index, maxRetries = 2) {
            return new Promise((resolve, reject) => {
                let attempts = 0;

                function attemptLoad() {
                    const img = new Image();
                    img.crossOrigin = "anonymous";

                    const timeout = setTimeout(() => {
                        img.src = ''; // 取消加载
                        if (attempts < maxRetries) {
                            attempts++;
                            console.log(`重试加载图片 ${index + 1}, 尝试 ${attempts + 1}/${maxRetries + 1}`);
                            attemptLoad();
                        } else {
                            console.error(`图片 ${index + 1} 加载失败，使用占位符`);
                            // 使用占位符
                            const placeholderImg = new Image();
                            placeholderImg.src = `https://via.placeholder.com/800x600/1a1a1a/8b0000?text=Warhammer+40K+Image+${index + 1}`;
                            placeholderImg.onload = () => resolve(placeholderImg);
                            placeholderImg.onerror = () => resolve(placeholderImg);
                        }
                    }, 10000); // 10秒超时

                    img.onload = () => {
                        clearTimeout(timeout);
                        console.log(`图片 ${index + 1} 加载成功`);
                        loadedImages.add(index);
                        resolve(img);
                    };

                    img.onerror = () => {
                        clearTimeout(timeout);
                        if (attempts < maxRetries) {
                            attempts++;
                            console.log(`图片 ${index + 1} 加载失败，重试 ${attempts + 1}/${maxRetries + 1}`);
                            setTimeout(attemptLoad, 1000);
                        } else {
                            console.error(`图片 ${index + 1} 加载失败，使用占位符`);
                            const placeholderImg = new Image();
                            placeholderImg.src = `https://via.placeholder.com/800x600/1a1a1a/8b0000?text=Warhammer+40K+Image+${index + 1}`;
                            placeholderImg.onload = () => resolve(placeholderImg);
                            placeholderImg.onerror = () => resolve(placeholderImg);
                        }
                    };

                    img.src = url;
                }

                attemptLoad();
            });
        }

        // 预加载图片
        async function preloadImages() {
            console.log('开始预加载图片...');

            // 预加载前5张图片
            for (let i = 0; i < Math.min(5, shuffledUrls.length); i++) {
                try {
                    const img = await loadImageReliably(shuffledUrls[i], i);
                    imageCache[i] = img;
                } catch (error) {
                    console.error(`预加载图片 ${i + 1} 失败`, error);
                }
            }

            console.log(`预加载完成，成功加载 ${Object.keys(imageCache).length} 张图片`);
        }

        // 创建轮播幻灯片
        function createSlides() {
            carousel.innerHTML = '';

            const slide = document.createElement('div');
            slide.className = 'carousel-slide active';
            slide.id = 'currentSlide';

            carousel.appendChild(slide);
        }

        // 显示指定索引的图片
        async function showImage(index) {
            const slide = document.getElementById('currentSlide');
            if (!slide) return;

            // 显示加载状态
            imageLoading.classList.add('show');
            loadStatus.textContent = '正在加载...';

            // 如果图片未缓存，先加载
            if (!imageCache[index]) {
                try {
                    const img = await loadImageReliably(shuffledUrls[index], index);
                    imageCache[index] = img;
                } catch (error) {
                    console.error(`加载图片 ${index + 1} 失败`, error);
                }
            }

            // 显示图片
            slide.innerHTML = '';
            if (imageCache[index]) {
                const img = imageCache[index].cloneNode();
                img.alt = `战锤40K 图片 ${index + 1}`;
                slide.appendChild(img);

                const loadedStatus = loadedImages.has(index) ? '✓ 已加载' : '使用占位符';
                loadStatus.textContent = loadedStatus;
            } else {
                loadStatus.textContent = '加载失败';
            }

            imageLoading.classList.remove('show');
            info.innerHTML = `图片 ${index + 1} / ${shuffledUrls.length}<br><span class="loading-status">${loadStatus.textContent}</span>`;

            // 预加载下一张和上一张
            preloadAdjacentImages(index);
        }

        // 预加载相邻的图片
        async function preloadAdjacentImages(index) {
            const nextIndex = (index + 1) % shuffledUrls.length;
            const prevIndex = (index - 1 + shuffledUrls.length) % shuffledUrls.length;

            // 预加载下一张
            if (!imageCache[nextIndex]) {
                loadImageReliably(shuffledUrls[nextIndex], nextIndex).then(img => {
                    imageCache[nextIndex] = img;
                    console.log(`预加载下一张完成: ${nextIndex + 1}`);
                });
            }

            // 预加载上一张
            if (!imageCache[prevIndex]) {
                loadImageReliably(shuffledUrls[prevIndex], prevIndex).then(img => {
                    imageCache[prevIndex] = img;
                    console.log(`预加载上一张完成: ${prevIndex + 1}`);
                });
            }
        }

        // 显示下一张图片
        async function showNextSlide() {
            currentIndex = (currentIndex + 1) % shuffledUrls.length;

            // 如果回到开头，重新洗牌
            if (currentIndex === 0) {
                console.log('重新开始循环，重新洗牌...');
                shuffledUrls = shuffleArray(imageUrls);
                imageCache = {};
                loadedImages.clear();
            }

            await showImage(currentIndex);
        }

        // 显示上一张图片
        async function showPrevSlide() {
            currentIndex = (currentIndex - 1 + shuffledUrls.length) % shuffledUrls.length;
            await showImage(currentIndex);
        }

        // 启动浏览器
        async function startViewer() {
            createSlides();
            initialLoading.style.display = 'none';
            await showImage(0);
            console.log('图片浏览器已启动！使用方向键或按钮切换图片');
        }

        // 初始化
        console.log('准备战锤40K图片浏览器...');

        preloadImages().then(() => {
            startViewer();
        });

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                showNextSlide();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                showPrevSlide();
            }
        });

        // 按钮控制
        nextBtn.addEventListener('click', showNextSlide);
        prevBtn.addEventListener('click', showPrevSlide);
    </script>
</body>
</html>
